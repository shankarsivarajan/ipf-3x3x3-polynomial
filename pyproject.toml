[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ipf-3x3x3-polynomial"
version = "0.1.0"
description = "The maximum likelihood eliminant of 3x3x3 no-three-way interaction tables: IPF limits, raking factors, and exact eliminants"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Shankar Sivarajan", email = "sivarajn@umich.edu" },
]
dependencies = [
  "mpmath>=1.3",
  "python-flint>=0.6",
  "numpy>=1.24",
]

[tool.setuptools.packages.find]
include = ["ipf333*"]

[tool.setuptools.package-data]
ipf333 = ["forms.json"]
